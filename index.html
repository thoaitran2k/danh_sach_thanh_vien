<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách thành viên tổ</title>
<style>
body{margin:0;background:#f4f5f7;color:#1c1e21;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:22px;margin:0 0 4px}
.card{background:#fff;border:1px solid #d6d9de;border-radius:12px;padding:16px;margin-top:16px}
label{display:block;font-size:14px;color:#65676b;margin:10px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d6d9de;border-radius:8px;font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid #e4e6ea}
.row:first-child{border-top:0}
.n{width:28px;text-align:center;font-weight:700}
.nm{flex:1;overflow-wrap:anywhere}.nm small{display:block;color:#65676b}
.mu{color:#65676b;font-size:14px}.ok{color:#15803d}.er{color:#b91c1c}
.bar{height:8px;border-radius:4px;background:#d6d9de;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#15803d;width:0}
.msg{margin-top:10px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="ttl"></h1>
  <div class="mu">Điền họ tên, chọn file thông tin cá nhân rồi bấm Gửi. Danh sách cập nhật ngay cho mọi người.</div>

  <div class="card">
    <b>Điền thông tin của bạn</b>
    <label for="nm">Họ và tên</label>
    <input type="text" id="nm" placeholder="Nguyễn Văn A" autocomplete="off">
    <label for="fl">File thông tin cá nhân (PDF, ảnh, Word… tối đa 10 MB)</label>
    <input type="file" id="fl">
    <div style="margin-top:12px"><button id="sub" disabled>Gửi</button></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between"><b>Đã điền</b><span id="cnt" class="mu"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div id="list" class="mu">Đang tải…</div>
  </div>

  <div class="card">
    <button id="gen" disabled>Tạo thư mục (ZIP)</button>
    <div class="msg" id="gmsg"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ====== CẤU HÌNH: sửa 4 dòng này ====== */
var SUPABASE_URL = 'https://mhmmfdwbbhsyrlrhdrpn.supabase.co';
var SUPABASE_KEY = 'sb_publishable_Q03no64CAt_zxtQOakkQRg_LhSIvxBu';
var TITLE = 'TỔ 6';            // tên tổ hiện trên tiêu đề bảng
var TOTAL = 8;                 // số thành viên cần có
var ADMIN_CODE = '123456';     // mã để bấm "Tạo thư mục" (đổi đi)
/* ====================================== */

var $ = function(i){return document.getElementById(i)};
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var rows = [];
var HEAD = 'DANH SÁCH THÀNH VIÊN ' + TITLE.toUpperCase();
$('ttl').textContent = HEAD; document.title = HEAD;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function say(el,t,c){el.textContent=t;el.className='msg '+(c||'')}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'file'}
function ext(n){var m=/\.[A-Za-z0-9]{1,8}$/.exec(n);return m?m[0].toLowerCase():''}

function render(){
  var n=rows.length;
  $('cnt').textContent=n+' / '+TOTAL;
  $('pb').style.width=Math.min(100,n/TOTAL*100)+'%';
  $('list').innerHTML=n?rows.map(function(r,i){
    return '<div class="row"><div class="n">'+(i+1)+'</div><div class="nm">'+esc(r.name)+'<small>'+esc(r.file_name)+'</small></div></div>';
  }).join(''):'Chưa có ai điền.';
  $('gen').disabled=!n;
  say($('gmsg'), n>=TOTAL?'Đã đủ thành viên, có thể tạo thư mục.':'Còn thiếu '+(TOTAL-n)+' thành viên (vẫn có thể tạo).', n>=TOTAL?'ok':'');
}

function load(){
  sb.from('members').select('*').order('id',{ascending:true}).then(function(r){
    if(r.error){$('list').innerHTML='<span class="er">Không đọc được dữ liệu: '+esc(r.error.message)+'</span>';return}
    rows=r.data||[];render();
  });
}
load();
try{sb.channel('members-live').on('postgres_changes',{event:'*',schema:'public',table:'members'},load).subscribe()}catch(e){}
setInterval(load,8000); // dự phòng: tự làm mới mỗi 8 giây

function chk(){$('sub').disabled=!($('nm').value.trim()&&$('fl').files.length)}
$('nm').addEventListener('input',chk);$('fl').addEventListener('change',chk);

$('sub').addEventListener('click',function(){
  var f=$('fl').files[0],name=$('nm').value.trim();
  if(!f||!name)return;
  if(f.size>10*1024*1024){say($('msg'),'File quá lớn (tối đa 10 MB).','er');return}
  $('sub').disabled=true;say($('msg'),'Đang tải file lên…','');
  var path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+ext(f.name);
  sb.storage.from('files').upload(path,f,{contentType:f.type||'application/octet-stream'}).then(function(u){
    if(u.error)throw u.error;
    return sb.from('members').insert({name:name,file_path:path,file_name:f.name});
  }).then(function(r){
    if(r.error)throw r.error;
    say($('msg'),'Đã lưu. Cảm ơn bạn!','ok');$('nm').value='';$('fl').value='';chk();
  }).catch(function(e){say($('msg'),'Lỗi: '+(e.message||e),'er');chk()});
});

$('gen').addEventListener('click',function(){
  if(prompt('Nhập mã quản trị:')!==ADMIN_CODE){say($('gmsg'),'Sai mã.','er');return}
  $('gen').disabled=true;say($('gmsg'),'Đang tải các file và nén…','');
  var zip=new JSZip(),folder='Danh-sach-to-'+slug(TITLE),names=[];
  Promise.all(rows.map(function(r,i){
    var fn=('0'+(i+1)).slice(-2)+'-'+slug(r.name)+ext(r.file_name);
    names[i]=fn;
    var url=sb.storage.from('files').getPublicUrl(r.file_path).data.publicUrl;
    return fetch(url).then(function(x){if(!x.ok)throw new Error('Không tải được file của '+r.name);return x.blob()}).then(function(b){zip.file(folder+'/files/'+fn,b)});
  })).then(function(){
    var tr=rows.map(function(r,i){
      return '<tr><td class="s">'+(i+1)+'</td><td>'+esc(r.name)+' <a href="files/'+encodeURIComponent(names[i])+'" target="_blank">(Xem)</a></td></tr>';
    }).join('');
    var html='<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(HEAD)+'</title><style>body{font-family:Arial,sans-serif;margin:0;padding:10px}table{border-collapse:collapse;margin:0 auto;width:100%;max-width:820px}th,td{border:2px solid #000;padding:11px 8px;text-align:center}th{font-size:18px}td.s{width:70px;font-weight:700}a{color:#1a0dab}</style></head><body><table><tr><th colspan="2">'+esc(HEAD)+'</th></tr>'+tr+'</table></body></html>';
    zip.file(folder+'/'+folder+'.html',html);
    return zip.generateAsync({type:'blob'});
  }).then(function(blob){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=folder+'.zip';
    document.body.appendChild(a);a.click();a.remove();
    say($('gmsg'),'Đã tạo '+folder+'.zip. Giải nén rồi mở file .html trong thư mục.','ok');$('gen').disabled=false;
  }).catch(function(e){say($('gmsg'),'Lỗi: '+(e.message||e),'er');$('gen').disabled=false});
});
</script>
</body>
</html>
